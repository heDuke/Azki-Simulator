name: Windows engine (QEMU + Python runtime)

# Windows port only: builds the custom QEMU with MSYS2, assembles the engine
# bundle (QEMU + helpers + embeddable Python + runtime) and smoke-tests it on
# x64 and ARM64. No firmware is downloaded, used or uploaded.
on:
  push:
    branches: [windows-winui]
    paths:
      - 'engine/**'
      - 'Sources/AzkiSimulator/Runtime/**'
      - 'tests/**'
      - 'windows/scripts/**'
      - 'windows/engine/**'
      - 'windows/src/**'
      - 'windows/tests/**'
      - 'windows/*.props'
      - 'windows/global.json'
      - '.github/workflows/windows-engine.yml'
  pull_request:
    branches: [windows-winui]
    paths:
      - 'engine/**'
      - 'Sources/AzkiSimulator/Runtime/**'
      - 'tests/**'
      - 'windows/scripts/**'
      - 'windows/engine/**'
      - 'windows/src/**'
      - 'windows/tests/**'
      - 'windows/*.props'
      - 'windows/global.json'
      - '.github/workflows/windows-engine.yml'
  workflow_dispatch:
    inputs:
      clean:
        description: Build QEMU without the cached build tree
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            runner: windows-latest
            msystem: UCRT64
          - rid: win-arm64
            arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up MSYS2 (${{ matrix.msystem }})
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          release: true
          cache: true
          pacboy: >-
            cc:p glib2:p pixman:p dtc:p pkgconf:p meson:p ninja:p python:p zstd:p
          install: >-
            make diffutils tar xz curl ${{ matrix.arch == 'arm64' && 'binutils' || '' }}

      - name: Toolchain versions
        shell: msys2 {0}
        run: |
          uname -a
          cc --version | head -1
          meson --version
          ninja --version
          pkgconf --modversion glib-2.0

      # The key pins the recipe and the MSYS2 toolchain; within it the newest
      # QEMU build tree is reused and only changed overlay sources rebuild.
      - name: Restore QEMU build tree
        if: ${{ !inputs.clean }}
        uses: actions/cache@v6
        with:
          path: build/windows-engine/work
          key: qemu-${{ matrix.rid }}-${{ hashFiles('windows/scripts/build-qemu.sh') }}-${{ hashFiles('engine/qemu-overlay/**', 'engine/project/backend/src/*.c', 'engine/project/backend/src/*.h', 'engine/third-party/**') }}
          restore-keys: qemu-${{ matrix.rid }}-${{ hashFiles('windows/scripts/build-qemu.sh') }}-

      - name: Build QEMU and helpers
        run: >-
          ./windows/scripts/build-qemu.ps1 -Arch ${{ matrix.arch }}
          -Msys2Root '${{ steps.msys2.outputs.msys2-location }}'

      - name: QEMU smoke test (outside MSYS2)
        run: |
          $qemu = "build/windows-engine/qemu-win-${{ matrix.arch }}/qemu-system-arm.exe"
          & $qemu --version
          if ($LASTEXITCODE) { throw "qemu --version failed" }
          $machines = & $qemu -machine help | Out-String
          $machines
          foreach ($m in 'best1503', 'azki-q65', 'azki-p65') {
            if ($machines -notmatch "(?m)^$m\s") { throw "machine $m missing" }
          }

      - name: Restore pinned Python downloads
        uses: actions/cache@v6
        with:
          path: build/windows-engine/downloads
          key: engine-downloads-${{ matrix.rid }}-${{ hashFiles('windows/scripts/assemble-engine.ps1') }}

      - name: Assemble Engine bundle
        run: ./windows/scripts/assemble-engine.ps1 -Arch ${{ matrix.arch }}

      # No firmware: manifest hashes, QEMU machines, the loopback TCP + token
      # control handshake (a client without the token gets no reply), the
      # graceful CTRL_BREAK stop, and Job-Object process groups.
      - name: Engine selftest
        run: |
          $bundle = "build/windows-engine/AzkiEngine-win-${{ matrix.arch }}"
          & "$bundle/azki-engine.cmd" selftest --require-graceful-stop
          if ($LASTEXITCODE) { throw "selftest failed ($LASTEXITCODE)" }

      - name: Python unit tests (Windows-applicable upstream tests)
        run: |
          $python = "build/windows-engine/AzkiEngine-win-${{ matrix.arch }}/Engine/python/python.exe"
          & $python -B -X utf8 windows/scripts/run-windows-tests.py
          if ($LASTEXITCODE) { throw "unit tests failed ($LASTEXITCODE)" }

      - name: Upload Engine bundle
        uses: actions/upload-artifact@v7
        with:
          name: AzkiEngine-${{ matrix.rid }}
          path: build/windows-engine/AzkiEngine-win-${{ matrix.arch }}
          retention-days: 14

      # The app half: Azki.Core against this very bundle, then one artifact with
      # AzkiSimulator.exe and the engine side by side (engine\ next to the exe).
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json

      - name: Azki.Core tests against the Engine bundle
        working-directory: windows
        run: |
          $env:AZKI_ENGINE_BUNDLE = (Resolve-Path "../build/windows-engine/AzkiEngine-win-${{ matrix.arch }}").Path
          dotnet test --project tests/Azki.Core.Tests/Azki.Core.Tests.csproj -c Release
          if ($LASTEXITCODE) { throw "Azki.Core tests failed ($LASTEXITCODE)" }

      - name: Publish app with the engine
        working-directory: windows
        run: |
          $platform = @{ 'win-x64' = 'x64'; 'win-arm64' = 'ARM64' }['${{ matrix.rid }}']
          $out = "${{ github.workspace }}/publish/AzkiSimulator-full-${{ matrix.rid }}"
          dotnet publish src/Azki.App/Azki.App.csproj -c Release -r ${{ matrix.rid }} -p:Platform=$platform -o $out
          if ($LASTEXITCODE) { throw "publish failed ($LASTEXITCODE)" }
          Copy-Item -Recurse "../build/windows-engine/AzkiEngine-win-${{ matrix.arch }}" "$out/engine"
          if (-not (Test-Path "$out/engine/Engine/manifest.json")) { throw "engine missing from the app folder" }

      - name: Smoke test (app starts next to its engine)
        run: |
          $exe = "${{ github.workspace }}/publish/AzkiSimulator-full-${{ matrix.rid }}/AzkiSimulator.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "AzkiSimulator.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload app + engine
        uses: actions/upload-artifact@v7
        with:
          name: AzkiSimulator-full-${{ matrix.rid }}
          path: publish/AzkiSimulator-full-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
